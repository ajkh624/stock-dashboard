name: Update live prices
on:
  schedule:
    # 매일 KST 18:00 = UTC 09:00 (평일)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pykrx
        run: pip install --quiet pykrx==1.0.51
      - name: Fetch KRX prices
        run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          if [[ -n $(git status -s data/live-prices.json) ]]; then
            git add data/live-prices.json
            git commit -m "chore: live prices $(TZ=Asia/Seoul date +%Y-%m-%d) KRX"
            git push
          else
            echo "no change"
          fi
