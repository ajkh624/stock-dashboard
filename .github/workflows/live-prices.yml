name: Update live prices
on:
  schedule:
    # 평일 KST 09:00-16:00 (UTC 00:00-07:00) 15분마다
    - cron: '*/15 0-7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Yahoo prices
        run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          if [[ -n $(git status -s data/live-prices.json) ]]; then
            git add data/live-prices.json
            git commit -m "chore: live prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no change"
          fi
